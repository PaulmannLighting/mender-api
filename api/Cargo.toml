[package]
name = "mender-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
macaddr = { version = "1.0", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.23", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
ipnet = { version = "2.12", features = ["serde"] }
log = "0.4"
clap = { version = "4.6", optional = true }
tokio = { version = "1.52", features = ["rt"] }

[lints]
workspace = true

[features]
clap = ["dep:clap"]
